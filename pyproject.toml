[project]
name = "survey-coder"
version = "0.1.0"
description = "LLM-assisted qualitative coding of student survey feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.6",
    "numpy>=2.4.6",
    "openai>=2.38.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
]

[project.scripts]
generate-codebooks = "survey_coder.generate_codebooks:main"
apply-codebooks = "survey_coder.apply_codebooks:main"
evaluate-results = "survey_coder.evaluate_results:main"
evaluate-gemini = "survey_coder.evaluate_gemini:main"
evaluate-ollama = "survey_coder.evaluate_ollama:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
